<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7faff" />
  <title>Ирина — настройки</title>
  <link rel="stylesheet" href="./admin.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="admin-shell">
    <section id="admin-loading" class="admin-state"><span class="admin-spinner"></span><span>Загружаем настройки…</span></section>
    <section id="admin-denied" class="admin-state" hidden><h1>Нет доступа</h1><p>Эта страница доступна только владельцу приложения внутри Telegram.</p></section>
    <form id="admin-form" class="admin-form" hidden>
      <header class="admin-header">
        <div><div class="admin-kicker">Ирина Mini App</div><h1>Настройки</h1><div class="admin-version-row"><span id="admin-release">v.02</span><span>Конфиг <strong id="config-version">1</strong></span></div></div>
        <a class="admin-home" href="/">Домой</a>
      </header>
      <div id="admin-sections"></div>
      <div id="admin-message" class="admin-message" aria-live="polite" hidden></div>
      <div class="admin-save-bar"><button id="save-button" class="save-button" type="submit">Сохранить изменения</button></div>
    </form>
  </main>
  <script type="module" src="./admin.js"></script>
</body>
</html>
